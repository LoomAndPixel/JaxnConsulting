<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="How the Client Lead Crawler works: four public data sources feed a pipeline on an NVIDIA Jetson Nano that normalizes, recognizes and geo-matches records; the scoring engine rates each lead 0 to 100, writes the daily pipeline to Google Sheets and sends leads scoring 70 or more to Slack within seconds"><rect width="1200" height="340" fill="#EAE3D6"/><rect x="20" y="60" width="236" height="84" rx="14" fill="#FBF8F2" stroke="#1C211E" stroke-width="2"/><text x="138.0" y="98" text-anchor="middle" font-family="Fraunces, serif" font-size="20" font-weight="500" fill="#1C211E">4 public sources</text><text x="138.0" y="122" text-anchor="middle" font-family="Instrument Sans, sans-serif" font-size="13" fill="#585E59">Police · permits · licenses · SAM.gov</text><path d="M264 102 L319.3333333333333 102" fill="none" stroke="#1C211E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M309.3333333333333 95 L319.3333333333333 102 L309.3333333333333 109" fill="none" stroke="#1C211E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="327.3333333333333" y="60" width="250" height="84" rx="14" fill="#1F4D3B" stroke="#1C211E" stroke-width="2"/><text x="452.3333333333333" y="98" text-anchor="middle" font-family="Fraunces, serif" font-size="20" font-weight="500" fill="#F4EFE6">Jetson Nano pipeline</text><text x="452.3333333333333" y="122" text-anchor="middle" font-family="Instrument Sans, sans-serif" font-size="13" fill="#D9E3DC">Normalize · NER · geo-match</text><path d="M585.3333333333333 102 L640.6666666666666 102" fill="none" stroke="#1C211E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M630.6666666666666 95 L640.6666666666666 102 L630.6666666666666 109" fill="none" stroke="#1C211E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="648.6666666666666" y="60" width="230" height="84" rx="14" fill="#FBF8F2" str